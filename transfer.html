<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>First Republic Bank - Pay & Request</title>
  
  <!-- Modern Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet"/>
  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/custom.css"/>
  <script src="js/state.js"></script>
  <script src="js/components.js"></script>
</head>
<body class="bg-[#f8faf9] text-slate-900 font-sans antialiased min-h-screen pb-24 md:pb-12">

  <!-- TOP APP BAR -->
  <header id="site-header" class="bg-white border-b border-slate-200/80 sticky top-0 z-40"></header>

  <!-- MAIN CANVAS -->
  <main class="max-w-xl mx-auto px-4 pt-5 pb-8 space-y-4">

    <!-- SEGMENTED TABS: PAY / REQUEST vs INTERNAL TRANSFER -->
    <div class="bg-slate-200/80 p-1 rounded-2xl flex text-xs font-bold text-slate-600">
      <button id="mode-pay" onclick="switchMode('pay')" class="flex-1 py-2 rounded-xl bg-white text-slate-900 shadow-sm transition-all btn-pill">
        Pay Someone
      </button>
      <button id="mode-request" onclick="switchMode('request')" class="flex-1 py-2 rounded-xl text-slate-600 hover:text-slate-900 transition-all btn-pill">
        Request Money
      </button>
      <button id="mode-internal" onclick="switchMode('internal')" class="flex-1 py-2 rounded-xl text-slate-600 hover:text-slate-900 transition-all btn-pill">
        Between Accounts
      </button>
    </div>

    <!-- P2P PAY / REQUEST FORM (Venmo & Cash App Style) -->
    <div id="p2p-container" class="space-y-4">

      <!-- BIG BOLD AMOUNT ENTRY CARD -->
      <div class="rounded-3xl bg-white border border-slate-200/80 p-6 sm:p-7 shadow-sm text-center">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block" id="amountLabel">Enter Amount</span>
        
        <div class="flex items-center justify-center my-3 text-4xl sm:text-5xl font-extrabold text-slate-900 font-mono tracking-tight">
          <span class="text-emerald-700 mr-1">$</span>
          <input id="p2pAmountInput" type="number" step="0.01" min="1" value="25.00" class="w-48 sm:w-56 text-center text-4xl sm:text-5xl font-extrabold text-slate-900 border-0 focus:ring-0 p-0 tabular-nums">
        </div>

        <!-- Quick preset amount chips -->
        <div class="flex items-center justify-center gap-2 mt-4 flex-wrap">
          <button onclick="setAmount(10)" class="px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-800 btn-pill">$10</button>
          <button onclick="setAmount(25)" class="px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-800 btn-pill">$25</button>
          <button onclick="setAmount(50)" class="px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-800 btn-pill">$50</button>
          <button onclick="setAmount(100)" class="px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-800 btn-pill">$100</button>
          <button onclick="setMaxAmount()" class="px-3.5 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-xs font-bold text-emerald-900 btn-pill">Max</button>
        </div>
      </div>

      <!-- RECIPIENT & MEMO CARD -->
      <div class="rounded-3xl bg-white border border-slate-200/80 p-5 shadow-sm space-y-4">
        
        <!-- Recipient input -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">To (Name, $Cashtag, phone, or email)</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-3 text-slate-400 text-lg">search</span>
            <input id="p2pRecipient" type="text" placeholder="e.g. $julianvance or eleanor@domain.com" class="w-full pl-10 pr-3 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs sm:text-sm font-semibold text-slate-900 fintech-input">
          </div>
        </div>

        <!-- Quick Contacts Avatars (Venmo style) -->
        <div>
          <span class="text-[11px] font-semibold text-slate-400 block mb-2">Recent &amp; Favorites</span>
          <div class="flex items-center space-x-2.5 overflow-x-auto pb-1 scrollbar-none" id="quickRecipients">
            <!-- Populated dynamically -->
          </div>
        </div>

        <div class="border-t border-slate-100 pt-2"></div>

        <!-- Note / Memo input -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Note</label>
          <div class="relative">
            <input id="p2pNote" type="text" placeholder="Whatâ€™s this for? â˜• ðŸ• ðŸ " class="w-full pl-3.5 pr-10 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs sm:text-sm text-slate-900 fintech-input" value="Dinner split ðŸ·">
            <span class="material-symbols-outlined absolute right-3 top-2.5 text-slate-400 text-lg">edit_note</span>
          </div>
        </div>

        <!-- Funding Source Selector -->
        <div class="p-3.5 bg-slate-50 rounded-2xl border border-slate-200/80 flex items-center justify-between text-xs">
          <div class="flex items-center space-x-2.5">
            <span class="material-symbols-outlined text-emerald-700 text-xl">account_balance_wallet</span>
            <div>
              <span class="font-bold text-slate-900 block" id="fundingSourceLabel">First Republic Cash</span>
              <span class="text-[11px] text-slate-500 font-mono" id="fundingSourceBalance">Available: $0.00</span>
            </div>
          </div>
          <button onclick="window.openAddCashModal()" class="text-xs font-bold text-emerald-800 hover:underline">
            + Add Cash
          </button>
        </div>

        <!-- ACTION BUTTON: PAY OR REQUEST -->
        <button id="p2pActionBtn" onclick="submitP2PAction()" class="w-full py-4 rounded-2xl bg-[#00241b] text-white font-extrabold text-sm sm:text-base hover:bg-emerald-950 transition-all btn-pill shadow-xl shadow-emerald-950/20 flex items-center justify-center space-x-2">
          <span id="p2pBtnText">Pay $25.00</span>
          <span class="material-symbols-outlined text-lg">arrow_forward</span>
        </button>
      </div>
    </div>

    <!-- INTERNAL ACCOUNT TRANSFER (Between Checking & Savings) -->
    <div id="internal-container" class="space-y-4 hidden">
      <div class="rounded-3xl bg-white border border-slate-200/80 p-5 shadow-sm space-y-4">
        <h3 class="text-sm font-bold text-slate-900">Transfer Between Accounts</h3>

        <!-- From Account -->
        <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200">
          <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block mb-1">From Account</span>
          <div class="flex justify-between items-center">
            <select id="internalFromSelect" onchange="updateInternalTransferUI()" class="bg-transparent border-0 font-bold text-slate-900 text-sm p-0 focus:ring-0 cursor-pointer">
              <!-- Populated dynamically -->
            </select>
            <span class="font-mono text-xs font-bold text-slate-700" id="internalFromBal">$0.00</span>
          </div>
        </div>

        <!-- Swap Button -->
        <div class="flex justify-center -my-2 relative z-10">
          <button onclick="swapInternalAccounts()" class="w-9 h-9 rounded-full bg-white border border-slate-300 text-slate-700 flex items-center justify-center shadow-sm hover:border-emerald-600 active:scale-90 transition-all">
            <span class="material-symbols-outlined text-base">swap_vert</span>
          </button>
        </div>

        <!-- To Account -->
        <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200">
          <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block mb-1">To Account</span>
          <div class="flex justify-between items-center">
            <select id="internalToSelect" onchange="updateInternalTransferUI()" class="bg-transparent border-0 font-bold text-slate-900 text-sm p-0 focus:ring-0 cursor-pointer">
              <!-- Populated dynamically -->
            </select>
            <span class="font-mono text-xs font-bold text-slate-700" id="internalToBal">$0.00</span>
          </div>
        </div>

        <!-- Amount -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Amount ($)</label>
          <input id="internalAmountInput" type="number" step="0.01" min="1" placeholder="100.00" class="w-full py-2.5 px-3 rounded-2xl bg-slate-50 border border-slate-200 text-sm font-bold text-slate-900 font-mono">
        </div>

        <button onclick="submitInternalTransfer()" class="w-full py-3.5 rounded-2xl bg-[#00241b] text-white font-bold text-sm hover:bg-emerald-950 transition-all btn-pill shadow-lg shadow-emerald-950/20">
          Transfer Instantly
        </button>
      </div>
    </div>

  </main>

  <!-- BOTTOM FLOATING DOCK -->
  <nav id="site-bottom-nav"></nav>

  <script>
    let currentMode = 'pay'; // 'pay', 'request', 'internal'

    document.addEventListener('DOMContentLoaded', () => {
      window.renderHeader('transfer');
      window.renderBottomNav('transfer');
      initTransferPage();

      // Check query params (e.g. ?recipient=$julianvance&name=Julian%20Vance)
      const params = new URLSearchParams(window.location.search);
      if (params.get('recipient')) {
        document.getElementById('p2pRecipient').value = params.get('recipient');
      }

      // Update button text when amount changes
      document.getElementById('p2pAmountInput').addEventListener('input', (e) => {
        updateBtnText();
      });
    });

    function initTransferPage() {
      const state = window.FRB.state;
      const checking = state.accounts[0];

      document.getElementById('fundingSourceBalance').innerText = `Available: ${window.FRB.formatCurrency(checking.balance)}`;

      // Render quick contacts
      const contacts = state.contacts || [];
      const contContainer = document.getElementById('quickRecipients');
      contContainer.innerHTML = contacts.map(c => `
        <button onclick="selectRecipient('${c.handle}', '${c.name}')" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-xl border border-slate-200 hover:border-emerald-700 bg-slate-50 hover:bg-emerald-50/50 transition-colors shrink-0 btn-pill">
          <img src="${c.avatar}" class="w-6 h-6 rounded-full object-cover">
          <div class="text-left leading-tight">
            <span class="text-xs font-bold text-slate-800 block">${c.name.split(' ')[0]}</span>
            <span class="text-[9px] text-slate-400 block">${c.handle}</span>
          </div>
        </button>
      `).join('');

      // Populate internal accounts
      const fromSel = document.getElementById('internalFromSelect');
      const toSel = document.getElementById('internalToSelect');

      fromSel.innerHTML = state.accounts.map((a, i) => `<option value="${a.id}" ${i === 0 ? 'selected' : ''}>${a.name}</option>`).join('');
      toSel.innerHTML = state.accounts.map((a, i) => `<option value="${a.id}" ${i === 1 ? 'selected' : ''}>${a.name}</option>`).join('');

      updateInternalTransferUI();
      updateBtnText();
    }

    function switchMode(mode) {
      currentMode = mode;
      const btnPay = document.getElementById('mode-pay');
      const btnReq = document.getElementById('mode-request');
      const btnInt = document.getElementById('mode-internal');

      const p2pCont = document.getElementById('p2p-container');
      const intCont = document.getElementById('internal-container');

      [btnPay, btnReq, btnInt].forEach(b => {
        b.className = 'flex-1 py-2 rounded-xl text-slate-600 hover:text-slate-900 transition-all btn-pill';
      });

      if (mode === 'pay') {
        btnPay.className = 'flex-1 py-2 rounded-xl bg-white text-slate-900 shadow-sm transition-all btn-pill';
        p2pCont.classList.remove('hidden');
        intCont.classList.add('hidden');
      } else if (mode === 'request') {
        btnReq.className = 'flex-1 py-2 rounded-xl bg-white text-slate-900 shadow-sm transition-all btn-pill';
        p2pCont.classList.remove('hidden');
        intCont.classList.add('hidden');
      } else if (mode === 'internal') {
        btnInt.className = 'flex-1 py-2 rounded-xl bg-white text-slate-900 shadow-sm transition-all btn-pill';
        p2pCont.classList.add('hidden');
        intCont.classList.remove('hidden');
      }
      updateBtnText();
    }

    function setAmount(val) {
      document.getElementById('p2pAmountInput').value = val.toFixed(2);
      updateBtnText();
    }

    function setMaxAmount() {
      const bal = window.FRB.state.accounts[0].balance;
      document.getElementById('p2pAmountInput').value = bal > 0 ? bal.toFixed(2) : '0.00';
      updateBtnText();
    }

    function updateBtnText() {
      const amt = parseFloat(document.getElementById('p2pAmountInput').value) || 0;
      const formatted = '$' + amt.toFixed(2);
      const text = document.getElementById('p2pBtnText');
      if (currentMode === 'pay') {
        text.innerText = `Pay ${formatted}`;
      } else if (currentMode === 'request') {
        text.innerText = `Request ${formatted}`;
      }
    }

    function selectRecipient(handle, name) {
      document.getElementById('p2pRecipient').value = handle;
      window.showToast(`Selected ${name} (${handle})`, 'info');
    }

    function submitP2PAction() {
      const rec = document.getElementById('p2pRecipient').value.trim();
      const amt = parseFloat(document.getElementById('p2pAmountInput').value);
      const note = document.getElementById('p2pNote').value.trim();

      if (!rec) {
        window.showToast('Please specify a recipient ($handle, name, or phone)', 'error');
        return;
      }
      if (!amt || amt <= 0) {
        window.showToast('Please enter an amount greater than $0', 'error');
        return;
      }

      try {
        if (currentMode === 'pay') {
          const res = window.FRB.sendPayment({ recipient: rec, amount: amt, note, action: 'Pay' });
          window.showToast(`Sent $${amt.toFixed(2)} to ${res.receiver || rec} (${res.receiverHandle || rec})!`, 'success');
        } else {
          window.FRB.sendPayment({ recipient: rec, amount: amt, note, action: 'Request' });
          window.showToast(`Requested $${amt.toFixed(2)} from ${rec}!`, 'success');
        }
        setTimeout(() => location.href = '/activity', 1000);
      } catch (err) {
        window.showToast(err.message, 'error');
      }
    }

    function updateInternalTransferUI() {
      const accounts = window.FRB.state.accounts;
      const fromId = document.getElementById('internalFromSelect').value;
      const toId = document.getElementById('internalToSelect').value;

      const fromAcc = accounts.find(a => a.id === fromId) || accounts[0];
      const toAcc = accounts.find(a => a.id === toId) || accounts[1];

      document.getElementById('internalFromBal').innerText = window.FRB.formatCurrency(fromAcc.balance);
      document.getElementById('internalToBal').innerText = window.FRB.formatCurrency(toAcc.balance);
    }

    function swapInternalAccounts() {
      const fromSel = document.getElementById('internalFromSelect');
      const toSel = document.getElementById('internalToSelect');

      const temp = fromSel.value;
      fromSel.value = toSel.value;
      toSel.value = temp;

      updateInternalTransferUI();
    }

    function submitInternalTransfer() {
      const fromId = document.getElementById('internalFromSelect').value;
      const toId = document.getElementById('internalToSelect').value;
      const amt = parseFloat(document.getElementById('internalAmountInput').value);

      if (fromId === toId) {
        window.showToast('Please select two different accounts', 'error');
        return;
      }
      if (!amt || amt <= 0) {
        window.showToast('Please enter an amount greater than $0', 'error');
        return;
      }

      try {
        window.FRB.transferFunds({ fromId, toId, amount: amt, memo: 'Account Transfer' });
        window.showToast(`Transferred $${amt.toFixed(2)} instantly!`, 'success');
        setTimeout(() => location.href = '/dashboard', 1000);
      } catch (err) {
        window.showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
